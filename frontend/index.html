<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Tenis de Mesa Torneos</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #000 !important;
        color: #fff;
        overflow-x: hidden;
      }
      .navbar {
        background-color: #800000 !important;
        margin-bottom: 0;
      }
      .btn-primary {
        background-color: #000;
        border-color: #000;
      }
      .btn-primary:hover {
        background-color: #a00000;
        border-color: #a00000;
      }
      /* Eliminar TODOS los espacios en blanco */
      .container {
        padding-left: 0;
        padding-right: 0;
        margin-left: 0;
        margin-right: 0;
        max-width: 100%;
      }
      .mt-5, .mt-4, .mt-3, .mt-2, .mt-1 {
        margin-top: 0 !important;
      }
      .mb-5, .mb-4, .mb-3, .mb-2, .mb-1 {
        margin-bottom: 0 !important;
      }
      .py-5, .py-4, .py-3, .py-2, .py-1 {
        padding-top: 0 !important;
        padding-bottom: 0 !important;
      }
      .px-5, .px-4, .px-3, .px-2, .px-1 {
        padding-left: 0 !important;
        padding-right: 0 !important;
      }
      /* Fondo negro para todas las páginas */
      #root {
        background-color: #000 !important;
        min-height: 100vh;
      }
      .App {
        background-color: #000 !important;
        min-height: 100vh;
      }
      /* Solo la página de educación mantiene su gradiente */
      .education-container {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
